# Dedupe thresholds, score weights and publishing rules.
# Every number the ranking depends on lives here — no magic numbers in code.

version: 1

embeddings:
  # Verified 2026-11-25 against fastembed 0.9.1's supported models: 384 dimensions,
  # 0.067 GB, MIT licence. fastembed downloads it on first use; Actions caches it.
  # Changing the model re-embeds every insight on the next score run.
  model: "BAAI/bge-small-en-v1.5"
  dimensions: 384
  cache_dir: ".cache/fastembed"
  batch_size: 64

dedupe:
  # Asked only for the uncertain band between the two thresholds below.
  judge_model: "claude-haiku-5-5"
  # Cosine similarity of the question embedding against every stored insight vector.
  # Checked against the real model by scripts/calibrate_dedupe.py, which the score
  # workflow runs before scoring. Measured on 2026-11-25 with bge-small-en-v1.5:
  #   same question, reworded:   0.830 - 0.958
  #   related, different:        0.719 - 0.899   (0.899 = dog vs cat car sickness)
  #   unrelated:                 0.375 - 0.552
  # merge_threshold was raised from the brief's 0.90 to 0.93 because the dog/cat pair
  # came within 0.001 of merging without the judge being asked.
  merge_threshold: 0.93        # >= this: merge into the existing insight, no LLM call
  judge_lower_threshold: 0.80  # between the two: ask the Claude judge
  # < judge_lower_threshold: new insight
  # Raised from 60 to 150 with the higher merge threshold: the first run used 59.
  max_judge_calls_per_run: 150
  judge_candidates_per_question: 3

weights:
  # Must sum to 1.0 — validated at config load. feedback_adjustment is applied on top
  # of the weighted sum, so it is not part of this budget.
  recurrence: 0.25
  cross_source: 0.20
  engagement: 0.20
  recency: 0.20
  trend: 0.15

recurrence:
  # log1p(item_count) / log1p(saturation_count), capped at 1.0
  saturation_count: 20

recency:
  half_life_days: 14

trend:
  window_days: 7
  baseline_days: 21
  ratio_cap: 3.0

feedback:
  # Insights semantically close to feed rows a reviewer marked `rejected` are penalised.
  similarity_threshold: 0.85
  penalty: -0.15
  lookback_days: 30

publish:
  daily_feed_size: 6           # 3 posts/day x 2 buffer
  max_per_category: 2          # category diversity rule
  min_general_pet_care: 1      # keep the travel campaign from crowding out everything
  max_general_pet_care: 2
  cooldown_days: 21            # an insight may not be re-served inside this window
  min_total_score: 0.15        # below this, publish fewer rows rather than weak ones
  angle_model: "claude-haiku-5-5"
  # One sentence. Angles carry no numbers, rules or facts — see prompts/angle.md.
  angle_max_chars: 160
