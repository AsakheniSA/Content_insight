# Source registry. The collector registry reads this file: adding a source means
# adding a module under src/tula_insights/collectors/ plus an entry here. Nothing else
# changes. `name` must match the collector module's `name` attribute exactly.
#
# `enabled: false` sources are skipped by the plan job and never appear in the matrix,
# so a source that is not built yet simply does not run.

version: 1

defaults:
  enabled: false
  timeout_seconds: 30
  max_retries: 4
  backoff_base_seconds: 1.0
  backoff_max_seconds: 60.0
  requests_per_minute: 30
  daily_request_cap: 50
  max_items_per_run: 200

sources:
  # ---- main discovery source --------------------------------------------------
  - name: web_questions
    enabled: true
    description: >-
      General web discovery through the Claude web search tool: forums, Q&A sites,
      veterinary and pet-travel sites, airline and government pet pages. Search
      results only (title, URL, page age); pages are not fetched.
    regions: [za, intl]
    requests_per_minute: 10
    daily_request_cap: 20
    max_items_per_run: 150
    settings:
      # No domain list to start with. A domain that blocks Anthropic's crawler makes the
      # API reject the whole request, so lists are added only after a dry run shows
      # which sites are worth allowing or blocking.
      allowed_domains: []
      blocked_domains: []
      max_uses_per_request: 3
      keyword_sets_per_run: 6
      engagement_basis: ["result_position", "query_recurrence"]
      intent: >-
        Find pages where pet owners ask questions or describe problems — forum threads,
        question-and-answer pages, community discussions — or official pages that answer
        them (airlines, governments, veterinary bodies), about: {category}.
      # A search term, not a domain restriction: it asks the engine for discussion
      # threads, wherever they live. "reddit" was tried on 2026-11-25 and returned no
      # reddit.com results from 6 queries, so it is no longer asked for. The run
      # summary still counts reddit.com results, in case that ever changes.
      query_hint: >-
        Include the word "forum" in at least one of your searches: that finds discussion
        threads where owners ask real questions.

  # ---- by hand ---------------------------------------------------------------
  - name: manual
    enabled: true
    description: >-
      Ingests unprocessed rows from the manual_submissions tab. The compliant path for
      Facebook, Instagram and Reddit, none of which have collectors. submitted_by and
      notes are not copied into items.
    regions: [za, intl]
    requests_per_minute: 60
    daily_request_cap: 1000
    max_items_per_run: 200
    settings: {}

  # ---- disabled --------------------------------------------------------------
  - name: reddit_search
    enabled: false
    description: >-
      DISABLED: Reddit blocks Anthropic's crawler, so the Claude web search tool rejects
      any request restricted to reddit.com ("The following domains are not accessible to
      our user agent", seen on 2026-11-25). The Reddit API is out of scope (brief §13).
      Kept so it can be switched back on unchanged if Reddit ever unblocks. Until then,
      Reddit threads come in by hand through manual_submissions.
    regions: [za, intl]
    requests_per_minute: 10
    daily_request_cap: 20
    max_items_per_run: 150
    settings:
      allowed_domains: ["reddit.com"]
      max_uses_per_request: 3
      keyword_sets_per_run: 6
      engagement_basis: ["result_position", "query_recurrence"]
      intent: >-
        Find Reddit threads where pet owners ask questions or describe problems about:
        {category}.

  # ---- brought forward from stage 7 ----------------------------------------
  - name: youtube
    enabled: true
    description: >-
      YouTube Data API v3. search.list for keyword sets, videos.list for view, like and
      comment counts, commentThreads.list for top-level comments. Comments that look
      like a question or a problem become items. No author fields and no channel names
      are stored. Rows are purged after 30 days (YouTube's storage limit — see
      settings.yaml retention.api_data_max_days).
    regions: [za, intl]
    requests_per_minute: 60
    daily_request_cap: 400
    max_items_per_run: 300
    settings:
      # Since June 2026 search.list has its own quota bucket of 100 calls a day, separate
      # from the 10,000-unit pool for everything else. 50 leaves room for manual runs.
      daily_search_cap: 50
      keyword_sets_per_run: 6
      max_videos_per_search: 10
      max_comments_per_video: 40
      comment_order: relevance
      relevance_language: en
      min_comment_chars: 25
      # A comment is kept if it has a "?" or one of these phrases. The classifier makes
      # the real call; this only stops "great video!" from costing a classification.
      question_cues:
        - "how do i"
        - "how can i"
        - "how do you"
        - "any advice"
        - "any tips"
        - "anyone know"
        - "does anyone"
        - "has anyone"
        - "should i"
        - "is it safe"
        - "can i"
        - "what do i"
        - "help"
        - "worried"
        - "nervous"
        - "scared"
        - "struggling"

  - name: news_rss
    enabled: false
    description: >-
      Curated RSS feeds from pet, veterinary and travel outlets, South African and
      international. Headline, summary snippet, URL and date only.
    regions: [za, intl]
    requests_per_minute: 30
    daily_request_cap: 100
    max_items_per_run: 200
    settings:
      feeds: []          # filled in at stage 7
      max_age_days: 14
