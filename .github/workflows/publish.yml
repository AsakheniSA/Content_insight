# Run the publish stage by hand: write today's ranked feed for the content team.
#
# Dispatch-only, like the other stage workflows; they all go away when pipeline.yml
# lands in stage 6. Running it twice on the same day serves nothing new: the day's
# feed is capped, so a second run only fills slots the first left empty.

name: Publish (manual)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Choose and write angles, but write nothing to the sheet"
        type: boolean
        default: true

permissions:
  contents: read

# Shared with the other stage workflows: one sheet-writing run at a time.
concurrency:
  group: tula-insights-sheet
  cancel-in-progress: false

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Validate the config
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID || vars.SHEET_ID }}
        run: python -m tula_insights validate-config

      - name: Publish
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID || vars.SHEET_ID }}
          TULA_RUN_SUMMARY: run_summary.json
        run: python -m tula_insights publish ${{ inputs.dry_run && '--dry-run' || '' }}

      # Counts only — this repository is public, so its artifacts are too.
      - name: Upload the run summary
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: publish-summary-${{ github.run_id }}
          path: run_summary.json
          if-no-files-found: ignore
          retention-days: 14
