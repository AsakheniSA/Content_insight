# Run the score stage by hand: merge repeat questions into insights and rank them.
#
# Dispatch-only, like collect.yml and classify.yml; all three go away when pipeline.yml
# lands in stage 6. The embedding model runs here on the runner (no API cost) and is
# cached between runs. Before scoring, the dedupe thresholds are checked against the
# real model on a fixed set of question pairs; if they misbehave, the run stops.

name: Score (manual)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Work everything out but write nothing"
        type: boolean
        default: true

permissions:
  contents: read

# Shared with collect.yml and classify.yml: one sheet-writing run at a time.
concurrency:
  group: tula-insights-sheet
  cancel-in-progress: false

jobs:
  score:
    name: Score
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install, with the embedding model's runtime
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[embeddings]"

      - name: Restore the embedding model
        uses: actions/cache@v4
        with:
          path: .cache/fastembed
          key: fastembed-${{ hashFiles('config/scoring.yaml') }}
          restore-keys: fastembed-

      - name: Validate the config
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID || vars.SHEET_ID }}
        run: python -m tula_insights validate-config

      - name: Check the dedupe thresholds against the real model
        run: python scripts/calibrate_dedupe.py

      - name: Score
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID || vars.SHEET_ID }}
        run: python -m tula_insights score ${{ inputs.dry_run && '--dry-run' || '' }}
