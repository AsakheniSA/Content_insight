# The daily pipeline: collect -> classify -> score -> publish, then one combined report.
#
# Runs every day at 05:17 SAST (03:17 UTC — off the hour, because scheduled runs near
# the top of the hour are often delayed). Run it by hand from the Actions tab too.
#
# State passes between jobs through the Google Sheet only; no job relies on files left
# by another, apart from small counts-only artifacts. Each source collects in its own
# job (fail-fast off), so one broken source never stops the others, and classify, score
# and publish carry on with whatever arrived — a feed every day, even on a bad one.
#
# Needs these repository secrets: ANTHROPIC_API_KEY, GOOGLE_SERVICE_ACCOUNT_JSON
# (base64), SHEET_ID (or a SHEET_ID variable), YOUTUBE_API_KEY.

name: Pipeline

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      source:
        description: "Collect from one source only"
        type: choice
        options: [all, web_questions, youtube, manual]
        default: all
      category:
        description: "Collect for one category id only, or 'all'"
        type: string
        default: all
      only_stage:
        description: "Run one stage only (the plan and report steps always run)"
        type: choice
        options: [all, collect, classify, score, publish]
        default: all
      sync_mode:
        description: "Classify one request per item now, instead of a half-price batch"
        type: boolean
        default: false
      dry_run:
        description: "Do the work but write nothing to the sheet"
        type: boolean
        default: true
      break_source:
        description: "Isolation test: deliberately break one source's credentials"
        type: choice
        options: [none, web_questions, youtube, manual]
        default: none

permissions:
  contents: read

# One sheet-writing run at a time. Never cancel a run in progress: a half-written run
# is worse than a queued one.
concurrency:
  group: tula-insights-pipeline
  cancel-in-progress: false

defaults:
  run:
    # Explicitly naming bash turns on pipefail, so `cmd | tee log` fails when cmd does.
    shell: bash

jobs:
  plan:
    name: Plan and prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sources: ${{ steps.plan.outputs.sources }}
      has_sources: ${{ steps.plan.outputs.has_sources }}
    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      SHEET_ID: ${{ secrets.SHEET_ID || vars.SHEET_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e .

      - name: Validate the config before spending anything
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python -m tula_insights validate-config

      - name: Plan the collect jobs
        id: plan
        run: python -m tula_insights plan --source "${{ inputs.source || 'all' }}"

      - name: Make sure the sheet's tabs exist
        run: python scripts/setup_sheet.py ${{ inputs.dry_run && '--dry-run' || '' }}

      # Once per run, here, rather than once in every parallel collect job.
      - name: Enforce platform storage limits (YouTube's 30 days)
        run: python -m tula_insights purge ${{ inputs.dry_run && '--dry-run' || '' }}

  collect:
    name: Collect (${{ matrix.source }})
    needs: plan
    if: >-
      needs.plan.outputs.has_sources == 'true' &&
      (github.event_name == 'schedule' || inputs.only_stage == 'all' || inputs.only_stage == 'collect')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        source: ${{ fromJSON(needs.plan.outputs.sources) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e .

      - name: Collect
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID || vars.SHEET_ID }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          SOURCE: ${{ matrix.source }}
          BREAK_SOURCE: ${{ inputs.break_source }}
          CATEGORY: ${{ inputs.category || 'all' }}
        run: |
          mkdir -p collect-stats logs
          if [ -n "$BREAK_SOURCE" ] && [ "$BREAK_SOURCE" = "$SOURCE" ]; then
            echo "::warning::Breaking $SOURCE on purpose for the isolation test"
            export ANTHROPIC_API_KEY=deliberately-invalid YOUTUBE_API_KEY=deliberately-invalid
            if [ "$SOURCE" = "manual" ]; then export SHEET_ID=deliberately-invalid; fi
          fi
          python -m tula_insights collect --source "$SOURCE" --category "$CATEGORY" \
            --no-purge --run-stats-out "collect-stats/$SOURCE.json" \
            ${{ inputs.dry_run && '--dry-run' || '' }} 2>&1 | tee "logs/collect-$SOURCE.log"

      # Written even if collection failed: a failed source may still have spent money.
      - name: Keep this job's figures for the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: collect-stats-${{ matrix.source }}
          path: collect-stats/
          if-no-files-found: ignore
          retention-days: 14

      - name: Mark this source as succeeded
        if: success()
        run: mkdir -p collect-ok && echo ok > "collect-ok/${{ matrix.source }}"
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: collect-ok-${{ matrix.source }}
          path: collect-ok/
          retention-days: 14

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: logs-collect-${{ matrix.source }}
          path: logs/
          if-no-files-found: ignore
          retention-days: 14

  classify:
    name: Classify
    needs: [plan, collect]
    if: >-
      always() && needs.plan.result == 'success' &&
      (github.event_name == 'schedule' || inputs.only_stage == 'all' || inputs.only_stage == 'classify')
    runs-on: ubuntu-latest
    # A batch run may wait up to 15 minutes for its batch.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e .

      - name: Find which sources succeeded
        if: needs.collect.result != 'skipped'
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          pattern: collect-ok-*
          path: collect-ok
          merge-multiple: true

      # The brief's rule: classify proceeds if at least one source succeeded.
      - name: Check at least one source succeeded
        if: needs.collect.result != 'skipped'
        run: |
          count=$(find collect-ok -type f 2>/dev/null | wc -l)
          echo "Sources that succeeded: $count"
          if [ "$count" -eq 0 ]; then
            echo "::error::Every source failed to collect, so classify is not run."
            exit 1
          fi

      - name: Classify
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID || vars.SHEET_ID }}
        run: |
          mkdir -p logs
          python -m tula_insights classify ${{ inputs.sync_mode && '--sync' || '' }} \
            ${{ inputs.dry_run && '--dry-run' || '' }} 2>&1 | tee logs/classify.log

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: logs-classify
          path: logs/
          if-no-files-found: ignore
          retention-days: 14

  score:
    name: Score
    needs: [plan, classify]
    # Runs even if classify failed: scoring yesterday's insights still gives a feed.
    if: >-
      always() && needs.plan.result == 'success' &&
      (github.event_name == 'schedule' || inputs.only_stage == 'all' || inputs.only_stage == 'score')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install, with the embedding model's runtime
        run: python -m pip install --upgrade pip && pip install -e ".[embeddings]"

      - name: Restore the embedding model
        uses: actions/cache@v4
        with:
          path: .cache/fastembed
          key: fastembed-${{ hashFiles('config/scoring.yaml') }}
          restore-keys: fastembed-

      - name: Check the dedupe thresholds against the real model
        run: python scripts/calibrate_dedupe.py

      - name: Score
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID || vars.SHEET_ID }}
        run: |
          mkdir -p logs
          python -m tula_insights score ${{ inputs.dry_run && '--dry-run' || '' }} \
            2>&1 | tee logs/score.log

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: logs-score
          path: logs/
          if-no-files-found: ignore
          retention-days: 14

  publish:
    name: Publish
    needs: [plan, score]
    if: >-
      always() && needs.plan.result == 'success' &&
      (github.event_name == 'schedule' || inputs.only_stage == 'all' || inputs.only_stage == 'publish')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e .

      - name: Publish today's feed
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID || vars.SHEET_ID }}
        run: |
          mkdir -p logs
          python -m tula_insights publish ${{ inputs.dry_run && '--dry-run' || '' }} \
            2>&1 | tee logs/publish.log

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: logs-publish
          path: logs/
          if-no-files-found: ignore
          retention-days: 14

  report:
    name: Report
    needs: [plan, collect, classify, score, publish]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      SHEET_ID: ${{ secrets.SHEET_ID || vars.SHEET_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e .

      - name: Gather the collect jobs' figures
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          pattern: collect-stats-*
          path: collect-stats
          merge-multiple: true

      # One job writes them, so parallel collect jobs never race to create the row.
      - name: Add them to the run's row
        run: python -m tula_insights record-run --from collect-stats

      - name: Summarise the whole run
        env:
          TULA_RUN_SUMMARY: run_summary.json
        run: python -m tula_insights report

      - name: Upload the run summary (counts only — this repository is public)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: run-summary
          path: run_summary.json
          if-no-files-found: ignore
          retention-days: 14
