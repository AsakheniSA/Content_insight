# Run the classify stage by hand, to test it in Actions before the full pipeline exists.
#
# Dispatch-only, like collect.yml; both go away when pipeline.yml lands in stage 6.
# Start with dry_run = true: it classifies a small sample one by one, prints counts,
# and writes nothing. Then sync_mode = true for a real run you can watch end to end.
# Batch mode (sync_mode = false) is what the scheduled pipeline will use: half price,
# but a batch can take a while, so a run waits up to 15 minutes and leaves anything
# unfinished for the next run to collect.

name: Classify (manual)

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Only classify items from this source"
        type: choice
        options: [all, web_questions, youtube, manual]
        default: all
      sync_mode:
        description: "One request per item now (true), or a half-price batch (false)"
        type: boolean
        default: true
      dry_run:
        description: "Classify a small sample and write nothing"
        type: boolean
        default: true

permissions:
  contents: read

# Shared with collect.yml: one sheet-writing run at a time.
concurrency:
  group: tula-insights-sheet
  cancel-in-progress: false

jobs:
  classify:
    name: Classify
    runs-on: ubuntu-latest
    # A batch run may wait up to 15 minutes for its batch.
    timeout-minutes: 30

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Validate the config before spending anything
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID || vars.SHEET_ID }}
        run: python -m tula_insights validate-config

      - name: Make sure the sheet's tabs exist
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID || vars.SHEET_ID }}
        run: python scripts/setup_sheet.py ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Classify
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID || vars.SHEET_ID }}
        run: |
          python -m tula_insights classify \
            --source "${{ inputs.source }}" \
            ${{ inputs.sync_mode && '--sync' || '' }} \
            ${{ inputs.dry_run && '--dry-run' || '' }}
