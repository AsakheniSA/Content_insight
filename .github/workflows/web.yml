# The read-only web view in web/: tests and a production build on every change, then a
# smoke test that reads the real sheet the way the app does (counts only — this
# repository is public). Deploying is Vercel's job, connected to this repository with
# Root Directory set to `web`.

name: Web

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/web.yml"]
  pull_request:
    paths: ["web/**", ".github/workflows/web.yml"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: web

jobs:
  check:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      # Type-checks as part of the build.
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  smoke:
    name: Read the real sheet
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          # This job holds secrets, so no shared dependency cache (setup-node's advice).
          package-manager-cache: false
      - run: npm ci
      - run: npm run smoke
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID || vars.SHEET_ID }}
