[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tula-insights"
version = "0.1.0"
description = "Tula Insights Layer — research and insights feed for the Tula content pipeline"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "pydantic==2.14.4",
    "PyYAML==6.0.4",
    "gspread==6.2.1",
    "google-auth==2.63.1",
    "anthropic==2.14.0",
    "requests==2.34.2",
    "feedparser==6.0.14",
    # A range, not a pin: numpy 2.5 needs Python 3.12+, and the workflows run 3.11.
    "numpy>=2.1,<3",
]

[project.optional-dependencies]
# The local embedding model for the score stage. Large (it pulls in onnxruntime), so it
# is installed only where scoring runs, not for CI's tests, which use a fake embedder.
embeddings = [
    "fastembed==0.9.1",
]
dev = [
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.6",
]

[project.scripts]
tula-insights = "tula_insights.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers -m 'not model'"
markers = [
    "model: needs the real embedding model (downloads it); run with -m model",
]
filterwarnings = ["error::DeprecationWarning:tula_insights.*"]
